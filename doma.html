<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Сайт приостановлен</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#10231f;--mut:#5d6b67;--line:rgba(16,35,31,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1c19;--card:#142824;--tx:#f1ede4;--mut:#a9b5b1;--line:rgba(241,237,228,.14)}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--tx);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px 32px;text-align:center}
h1{font-size:28px;line-height:1.2;margin-bottom:14px}
p{color:var(--mut)}
p+p{margin-top:10px}
</style>
</head>
<body>
<main>
  <h1>Сайт приостановлен</h1>
  <p>Работа по созданию сайта не оплачена.</p>
  <p>Сайт снова заработает сразу после оплаты.</p>
</main>
</body>
</html>
